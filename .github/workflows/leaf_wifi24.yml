name: leaf_wifi24

on:
  push:
    branches: [main, claude/**]
    paths:
      - 'firmware/leaf_wifi24/**'
      - '.github/workflows/leaf_wifi24.yml'
  pull_request:
    paths:
      - 'firmware/leaf_wifi24/**'
      - '.github/workflows/leaf_wifi24.yml'
  workflow_dispatch:

concurrency:
  group: leaf_wifi24-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.platformio/.cache
            ~/.platformio/packages
            ~/.platformio/platforms
          key: pio-leaf-wifi24-${{ runner.os }}-${{ hashFiles('firmware/leaf_wifi24/platformio.ini') }}
          restore-keys: |
            pio-leaf-wifi24-${{ runner.os }}-

      - name: Install PlatformIO
        run: pip install --upgrade platformio

      - name: Build leaf_wifi24
        working-directory: firmware/leaf_wifi24
        run: pio run -e leaf_wifi24

      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v4
        with:
          name: leaf_wifi24-firmware
          path: |
            firmware/leaf_wifi24/.pio/build/leaf_wifi24/firmware.bin
            firmware/leaf_wifi24/.pio/build/leaf_wifi24/firmware.elf
          if-no-files-found: warn
