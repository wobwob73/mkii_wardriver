name: branch_wifi5

on:
  push:
    branches: [main, claude/**]
    paths:
      - 'firmware/branch_wifi5/**'
      - '.github/workflows/branch_wifi5.yml'
  pull_request:
    paths:
      - 'firmware/branch_wifi5/**'
      - '.github/workflows/branch_wifi5.yml'
  workflow_dispatch:

concurrency:
  group: branch_wifi5-${{ github.ref }}
  cancel-in-progress: true

env:
  PICO_SDK_TAG: '2.1.0'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: repo

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake \
            gcc-arm-none-eabi \
            libnewlib-arm-none-eabi \
            libstdc++-arm-none-eabi-newlib \
            build-essential \
            python3 \
            git \
            ninja-build

      - name: Cache pico-sdk
        id: cache-pico-sdk
        uses: actions/cache@v4
        with:
          path: pico-sdk
          key: pico-sdk-${{ env.PICO_SDK_TAG }}

      - name: Fetch pico-sdk
        if: steps.cache-pico-sdk.outputs.cache-hit != 'true'
        run: |
          git clone --depth=1 --branch ${{ env.PICO_SDK_TAG }} https://github.com/raspberrypi/pico-sdk.git
          cd pico-sdk && git submodule update --init --depth=1

      - name: Configure and build branch_wifi5
        env:
          PICO_SDK_PATH: ${{ github.workspace }}/pico-sdk
        run: |
          cd repo/firmware/branch_wifi5
          mkdir -p build
          cd build
          cmake -G Ninja -DPICO_BOARD=pico ..
          ninja branch_wifi5

      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v4
        with:
          name: branch_wifi5-firmware
          path: |
            repo/firmware/branch_wifi5/build/branch_wifi5.uf2
            repo/firmware/branch_wifi5/build/branch_wifi5.elf
          if-no-files-found: warn
