[env:leaf_wifi5]
; pioarduino is the community-maintained PlatformIO platform that tracks
; current arduino-esp32 releases. Mainline `espressif32` lags arduino-esp32
; by months; ESP32-C5 support reached arduino-esp32 in 3.x but isn't in
; the registry's espressif32@^6.9.0 board list yet (CI confirmed). pioarduino
; ships an esp32-c5-devkitc-1 board file and the matching arduino-esp32 v3.x.
;
; Using the git+tag form (rather than the release-asset zip URL, whose asset
; name varies across releases) so the resolved platform is always the tagged
; commit. 55.03.38-1 is the latest stable as of this commit.
platform = https://github.com/pioarduino/platform-espressif32.git#55.03.38-1
board = esp32-c5-devkitc-1
framework = arduino
monitor_speed = 230400
upload_speed = 921600
build_flags =
    -DLEAF_VERSION=\"1.0.3\"
    -DLEAF_BAND_5G=1
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DMAX_LINE_LEN=200
    -DHB_INTERVAL_MS=10000
    -DCONFIG_TIMEOUT_MS=10000
    -DSCAN_FAIL_RESET_THRESHOLD=10
    -DSCAN_FAIL_REBOOT_THRESHOLD=50
    -DHEAP_MIN_BYTES=16384
    -DWIDS_RING_SIZE=64
    -DWIDS_SEEN_BSSID_MAX=512
    -DCORE_DEBUG_LEVEL=0
