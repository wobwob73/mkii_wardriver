[env:leaf_wifi24]
; Pinned to the same pioarduino fork + tag as leaf_wifi5 so both 2.4/5 GHz
; Leaves build against an identical, deterministic platform. Bare
; `platform = espressif32` is unpinned: it can resolve to a locally-installed
; pioarduino override while a fresh CI runner pulls mainline espressif32,
; diverging the arduino-esp32 core between environments.
platform = https://github.com/pioarduino/platform-espressif32.git#55.03.38-1
board = seeed_xiao_esp32c3
framework = arduino
monitor_speed = 230400
upload_speed = 921600
build_flags =
    -DLEAF_VERSION=\"1.3.0\"
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DMAX_LINE_LEN=200
    -DHB_INTERVAL_MS=10000
    -DCONFIG_TIMEOUT_MS=10000
    -DSCAN_FAIL_RESET_THRESHOLD=10
    -DSCAN_FAIL_REBOOT_THRESHOLD=50
    -DHEAP_MIN_BYTES=16384
    -DWIDS_RING_SIZE=64
    -DWIDS_SEEN_BSSID_MAX=512
    -DCORE_DEBUG_LEVEL=0
